[package]
name = "mobileaiserver"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"

# Phone-sized binaries: optimize for size, strip symbols.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
